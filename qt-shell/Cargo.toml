[package]
name = "opengg-qt"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "opengg-qt"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["full"] }
# preserve_order keeps the shared ui-settings.json key order stable on rewrite.
serde_json = { version = "1", features = ["preserve_order"] }
# Shared business logic incl. the daemon D-Bus client (plan §2.2/§2.3).
# DeviceController now uses opengg_core::device; AudioController still has a
# local zbus client (TODO(core): migrate audio.rs to opengg_core::audio next).
opengg-core = { path = "../core" }
zbus = "4"

[build-dependencies]
cxx-qt-build = "0.9"
