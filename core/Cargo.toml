[package]
name = "opengg-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenGG shared business logic (Tauri-free): clips DB, media, settings, storage, extensions, recording, VU. Consumed by both the Tauri host and the Qt/QML shell."

[lib]
name = "opengg_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NFKD normalization for game-title search keys (ported from stores/replay.ts).
unicode-normalization = "0.1"
# XDG config-dir resolution + "open folder in file manager" for settings IO.
dirs = "5"
open = "5"
