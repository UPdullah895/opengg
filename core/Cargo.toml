[package]
name = "opengg-core"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "OpenGG shared business logic (Tauri-free): clips DB, media, settings, storage, extensions, recording, VU. Consumed by both the Tauri host and the Qt/QML shell."

[lib]
name = "opengg_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NFKD normalization for game-title search keys (ported from stores/replay.ts).
unicode-normalization = "0.1"
# XDG config-dir resolution + "open folder in file manager" for settings IO.
dirs = "5"
open = "5"
# Recursive clip-directory walking for storage stats.
walkdir = "2"
# Filesystem watcher for the clip library (clip_added/removed auto-refresh).
notify = "6"
# Clip metadata / trim-state / ffprobe-cache database (matches src-tauri).
rusqlite = { version = "0.31", features = ["bundled"] }
# Async task spawning for ffmpeg/ffprobe calls (moved from src-tauri).
# "process" is required by the (currently unused, dead_code-allowed) async
# runners in subprocess.rs (run_async / tokio_command) moved verbatim from src-tauri.
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process"] }
# Debug/info/warn logging in the moved audio + subprocess modules.
log = "0.4"
# Low-level FFI for Unix timestamp formatting in fmt_ts_local.
libc = "0.2"
# Async HTTP client for Steam Store API (steam detection moved from src-tauri).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
# Blocking D-Bus client for daemon communication (project decision: blocking API in core).
# Note: do NOT add "tokio" feature — core uses blocking API only; src-tauri's tokio-featured
# zbus will unify at the workspace level when cargo resolves transitive deps.
zbus = "4"
