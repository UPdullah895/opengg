version: 2

updates:
  # Daemon crate dependencies
  - package-ecosystem: cargo
    directory: /daemon
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(daemon):"
    groups:
      # Group minor and patch updates into a single PR to reduce noise
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Qt6/QML shell crate dependencies
  - package-ecosystem: cargo
    directory: /qt-shell
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(qt-shell):"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # opengg-core crate dependencies
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(core):"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(actions):"
