name: Security Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly security scan at 02:00 UTC on Mondays
    - cron: '0 2 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit-daemon:
    name: Cargo Audit (Daemon)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
        working-directory: ./daemon

  # Audits the Qt6/QML shell. The Tauri backend and Vue frontend that used
  # to live under frontend/ have been removed entirely — they were archived
  # and no longer built or shipped, so scanning their dependency trees only
  # produced noise: advisories against code that never ran.
  cargo-audit-qt-shell:
    name: Cargo Audit (Qt Shell)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qt-shell
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Audits Cargo.lock only — no Qt/GStreamer headers needed, so this
      # stays on ubuntu-latest rather than the Arch container CI uses to
      # actually compile the shell.
      - name: Run cargo audit
        run: cargo audit
        working-directory: ./qt-shell

  # opengg-core is the only crate the shell and the daemon both depend on, so
  # an advisory here reaches every shipped binary. It has its own lockfile
  # (the three crates are deliberately not a workspace), which the daemon and
  # qt-shell jobs above do not cover.
  cargo-audit-core:
    name: Cargo Audit (Core)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
        working-directory: ./core

  cargo-deny-daemon:
    name: Cargo Deny (Daemon)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          log-level: warn
          manifest-path: ./daemon/Cargo.toml
          command: check advisories bans

  cargo-deny-qt-shell:
    name: Cargo Deny (Qt Shell)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          log-level: warn
          manifest-path: ./qt-shell/Cargo.toml
          command: check advisories bans

  cargo-deny-core:
    name: Cargo Deny (Core)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          log-level: warn
          manifest-path: ./core/Cargo.toml
          command: check advisories bans

  # The `npm Audit (Frontend)` job that used to live here scanned the archived
  # Vue app under frontend/. It is no longer built, packaged, or launched, so
  # the job was reporting vulnerabilities in dependencies that never ship —
  # permanently red for no actionable reason. The Qt shell has no npm tree.
