name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run: exercise the Arch build and the four distro-container package
  # builds on a PR that touches the packaging, so breakage shows up before a
  # tag. The `publish` job below is skipped for anything but a v* tag.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-packages.sh'
      - 'scripts/install-build-deps.sh'
      - 'packaging/nfpm/**'
      - 'packaging/*.service'
      - 'packaging/*.rules'
      - 'qt-shell/build.rs'

# Releases are created exactly once, by the final `publish` job, after every
# build job has uploaded its artifact (avoids concurrent release-creation races).
permissions:
  contents: read

jobs:
  build-arch:
    name: Arch tarball
    runs-on: ubuntu-latest
    # Same container CI uses to build the Qt6/QML shell: it needs Qt 6.7+
    # (per-corner radii, etc.) which ubuntu-latest's Qt packages don't have.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm \
            base-devel curl pkgconf cmake ninja clang github-cli \
            qt6-base qt6-declarative qt6-multimedia qt6-shadertools \
            gstreamer gst-plugins-base gst-plugins-base-libs \
            gst-plugins-good gst-plugins-bad gst-plugin-qml6 \
            ttf-dejavu

      - name: Install Rust via rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon -> target
            qt-shell -> target

      - name: Build daemon (release)
        run: cd daemon && cargo build --release

      - name: Build Qt6/QML frontend (release)
        run: cd qt-shell && cargo build --release

      - name: Package release tarball
        run: |
          # On a pull_request GITHUB_REF_NAME is e.g. "58/merge"; only a tag
          # names a version.
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' qt-shell/Cargo.toml | head -n1)"
          fi
          ROOT="opengg-v${VERSION}-linux-x86_64"
          TARBALL="${ROOT}.tar.gz"

          mkdir -p "$ROOT/usr/bin"
          cp qt-shell/target/release/opengg-qt "$ROOT/usr/bin/opengg"
          cp daemon/target/release/openggd "$ROOT/usr/bin/openggd"

          mkdir -p "$ROOT/usr/lib/udev/rules.d"
          cp packaging/99-opengg.rules "$ROOT/usr/lib/udev/rules.d/"

          mkdir -p "$ROOT/usr/share/dbus-1/services"
          cp packaging/org.opengg.Daemon.service "$ROOT/usr/share/dbus-1/services/"

          mkdir -p "$ROOT/usr/lib/systemd/user"
          cp packaging/openggd.service "$ROOT/usr/lib/systemd/user/"

          mkdir -p "$ROOT/usr/share/polkit-1/actions"
          cp packaging/org.opengg.setup.policy "$ROOT/usr/share/polkit-1/actions/"

          mkdir -p "$ROOT/usr/share/applications"
          cp packaging/opengg.desktop "$ROOT/usr/share/applications/"

          # The UI reads its translations from here at runtime. Omitting them
          # does not fail the build or the launch — the app just renders every
          # string as its raw key ("nav.home", "dashboard.title"), which is how
          # v0.2.0 shipped.
          mkdir -p "$ROOT/usr/share/opengg/locales"
          cp qt-shell/locales/*.json "$ROOT/usr/share/opengg/locales/"

          mkdir -p "$ROOT/usr/share/icons/hicolor/256x256/apps"
          cp packaging/icons/256x256.png "$ROOT/usr/share/icons/hicolor/256x256/apps/opengg.png"

          tar -czf "$TARBALL" "$ROOT"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-arch-tarball
          path: ${{ env.TARBALL }}
          if-no-files-found: error

  # Native .deb / .rpm. Each runs INSIDE its distro's container so the binary
  # links that distro's own Qt (a binary built against one distro's Qt does not
  # load on another). Ubuntu 24.04 / Debian 12 (Qt 6.4) are unsupported.
  packages:
    name: ${{ matrix.target }} package
    runs-on: ubuntu-latest
    # The opensuse/tumbleweed image defines no ENV PATH (the others do). The
    # runner builds each step's PATH as <GITHUB_PATH entries>:<base PATH>, so
    # without a base the rustup step's ~/.cargo/bin became the whole PATH and
    # the next step died with `exec: "sh": executable file not found`. Give
    # the job a standard base PATH explicitly.
    container:
      image: ${{ matrix.image }}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: debian13,   image: 'debian:trixie',        family: debian }
          - { target: ubuntu2604, image: 'ubuntu:26.04',         family: debian }
          # Pinned (not :latest) because the rpm release tag "fc44" is part of
          # the file name; bump together with scripts/build-packages.sh.
          - { target: fedora44,   image: 'fedora:44',            family: fedora }
          - { target: tumbleweed, image: 'opensuse/tumbleweed',  family: suse }

    steps:
      - name: Bootstrap (git for checkout)
        run: |
          case "${{ matrix.family }}" in
            debian) apt-get update && apt-get install -y --no-install-recommends ca-certificates git ;;
            fedora) dnf install -y git ca-certificates tar gzip ;;
            # gawk is named explicitly: with --no-recommends zypper otherwise picks
            # busybox-gawk to satisfy git's `awk`, which then conflicts with the real
            # gawk that qt6-base-devel pulls in later (via cups-devel -> rpm-build).
            suse)   zypper --non-interactive install --no-recommends git gawk ca-certificates tar gzip ;;
          esac

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: scripts/install-build-deps.sh ${{ matrix.family }}

      - name: Install Rust via rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon -> target
            qt-shell -> target
          key: ${{ matrix.target }}

      - name: Build daemon (release)
        run: cd daemon && cargo build --release

      - name: Build Qt6/QML frontend (release)
        run: cd qt-shell && cargo build --release

      - name: Build package
        env:
          # Empty on a pull_request (ref_name is "58/merge"): build-packages.sh
          # then falls back to the version in qt-shell/Cargo.toml.
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          OUT_DIR: dist
        run: scripts/build-packages.sh ${{ matrix.target }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-pkg-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-arch, packages]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: OpenGG ${{ github.ref_name }}
          body: |
            See the [README](https://github.com/UPdullah895/opengg#readme) for installation instructions.

            Native packages (x86_64): `.deb` for Debian 13 and Ubuntu 26.04, `.rpm` for Fedora 44 and openSUSE Tumbleweed. Arch users: the tarball is what the `opengg-bin` AUR package installs. Verify downloads against `SHA256SUMS`.
          draft: false
          prerelease: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
