name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-daemon:
    name: Rust Daemon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./daemon"
      - name: Check
        run: cargo check
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy -- -D warnings

  # The Qt6/QML shell — the only UI OpenGG ships. The old Tauri + Vue
  # frontend/ was removed entirely (it had been archived, kept only for
  # reference, and was never built or launched by default).
  #
  # Runs in the Arch container rather than on ubuntu-latest because the QML
  # uses Qt 6.7+ APIs (per-corner radii such as topLeftRadius); Ubuntu's Qt
  # is older and would fail at runtime with QML warnings rather than at
  # compile time.
  qt-shell:
    name: Qt6/QML Shell
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./qt-shell
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        working-directory: .
        run: |
          pacman -Syu --noconfirm \
            base-devel curl pkgconf cmake ninja clang \
            qt6-base qt6-declarative qt6-multimedia qt6-shadertools \
            gstreamer gst-plugins-base gst-plugins-base-libs \
            gst-plugins-good gst-plugins-bad gst-plugin-qml6 \
            ttf-dejavu

      - name: Install Rust via rustup
        working-directory: .
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./qt-shell"

      # Cheap and dependency-free, so it runs before the expensive build.
      - name: Theme/icon lint (no bare hex, no emoji icons)
        run: ./tools/check-colors.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # Debug, not release: ui-shots.sh runs target/debug/opengg-qt and errors
      # out if it is missing. Clippy does not emit binaries, so this is the
      # step that actually produces one.
      - name: Build
        run: cargo build

      # The repo's mandatory UI gate: renders every page offscreen and fails
      # on any QML warning. Catches the class of bug a compile cannot —
      # broken bindings, missing properties, layout errors.
      - name: Offscreen UI capture (must emit zero QML warnings)
        run: ./tools/ui-shots.sh

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: qt-shell/target/ui-shots
          if-no-files-found: warn
